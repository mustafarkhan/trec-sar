[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trecsar-core"
version = "0.1.0"
description = "Link-aware Bayesian search planning for search-and-rescue ground robots"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["trecsar_core"]
